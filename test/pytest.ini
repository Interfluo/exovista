[pytest]
addopts = --durations=20 -ra
testpaths = .
norecursedirs = data
python_files = *.py
# Later entries win.  The suite itself must never use the deprecated
# top-level aliases of the legacy API (exovista.File, ...): those accesses are
# errors here; tests of the deprecation use pytest.warns.
filterwarnings =
    ignore::DeprecationWarning
    error:exovista\.\w+ is deprecated:DeprecationWarning
