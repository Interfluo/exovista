name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-test:
    name: Build, check and test the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          ls -l dist
      - name: Check the distribution metadata
        run: python -m twine check --strict dist/*
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "tag=$TAG wheel version=$version"
          test "${TAG#v}" = "$version"
      - name: Install the wheel and run the test suite against it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls dist/*.whl)[test]"
          mkdir "$RUNNER_TEMP/suite"
          cp -r test examples README.md "$RUNNER_TEMP/suite/"
          cd "$RUNNER_TEMP/suite"
          "$RUNNER_TEMP/venv/bin/python" -c "import exovista; print(exovista.__version__, exovista.__file__); assert 'site-packages' in exovista.__file__"
          "$RUNNER_TEMP/venv/bin/python" -m pytest test -p no:cacheprovider -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/exovista
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
